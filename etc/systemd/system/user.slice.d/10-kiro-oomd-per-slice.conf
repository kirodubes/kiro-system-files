# ============================================================================
# Kiro-ISO systemd-oomd Per-Slice Policy (user.slice, all user sessions)
# ============================================================================
# Puts the system manager's user.slice (every logged-in user) under oomd's
# memory-pressure kills. This is NOT the same as user/slice.d/, which applies
# inside each user's own systemd --user instance (app.slice, at 80%).
#
# No ManagedOOMMemoryPressureLimit: the slice uses DefaultMemoryPressureLimit
# (systemd default 60%) for DefaultMemoryPressureDurationSec
# (see oomd.conf.d/10-kiro-oomd.conf).
#
# Moved here from the kiro-iso airootfs (etc/systemd/system/user.slice.d/oomd.conf)
# on 2026-11-15, so the whole oomd policy lives in one package.

[Slice]

# Enable oomd-managed kills inside this slice
ManagedOOMMemoryPressure=kill
