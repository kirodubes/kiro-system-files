# ============================================================================
# AMD GPU Driver Module Parameters
# ============================================================================

# OverDrive (manual fan/clock/voltage control) — OFF by default, opt-in only
#
# ppfeaturemask=0xffffffff enables every power-management feature including
# OverDrive, which tools like CoreCtrl and LACT need for manual tuning. It is
# not the default because:
#   - the kernel taints itself as CPU_OUT_OF_SPEC ("S") and logs "Overdrive is
#     enabled, please disable it before reporting any bugs"
#   - it is known to cause GPU resets on early Vega and some Navi 10/14 cards
#
# To opt in, uncomment the line below, then reboot. On a hang, try 0xfffd7fff.
# options amdgpu ppfeaturemask=0xffffffff
